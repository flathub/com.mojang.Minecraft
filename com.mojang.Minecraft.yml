app-id: com.mojang.Minecraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: minecraft
separate-locales: false
tags:
  - proprietary
finish-args:
  - --persist=.minecraft
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --env=XCURSOR_PATH=/run/host/share/icons:/run/host/user-share/icons
  - --env=LC_ALL=C
  - --env=SSL_CERT_FILE=
  - --unset-env=SSL_CERT_FILE
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
modules:
  - name: flite
    config-opts:
      - --enable-shared
    no-parallel-make: true
    sources:
      - type: git
        url: https://github.com/festvox/flite.git
        tag: v2.2
        commit: e9e2e37c329dbe98bfeb27a1828ef9a71fa84f88
        x-checker-data:
          type: git
          tag-pattern: ^v([\\d.]+)$

  - name: xrandr
    sources:
      - type: archive
        url: https://www.x.org/archive/individual/app/xrandr-1.5.4.tar.gz
        sha256: b022276f1f2e6e206803027a5f569e6eb51e69d2d8886bfb5a7bc0612ddca4ee

  - name: minecraft
    buildsystem: simple
    sources:
      - type: extra-data
        filename: Minecraft.tar.gz
        url: https://launcher.mojang.com/download/Minecraft.tar.gz
        sha256: 695269281547bbbcf47fe74633027a0e4ddc13a61060c686a7217e85d314e45e
        size: 1102510
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xf Minecraft.tar.gz
          - rm -f Minecraft.tar.gz
      - type: file
        path: minecraft
      - type: file
        path: com.mojang.Minecraft.desktop
      - type: file
        path: com.mojang.Minecraft.png
      - type: file
        path: com.mojang.Minecraft.svg
      - type: file
        path: com.mojang.Minecraft.appdata.xml
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dp -m 755 minecraft /app/bin/minecraft
      - install -Dp -m 644 com.mojang.Minecraft.desktop /app/share/applications/com.mojang.Minecraft.desktop
      - install -Dp -m 644 com.mojang.Minecraft.png /app/share/icons/hicolor/128x128/apps/com.mojang.Minecraft.png
      - install -Dp -m 644 com.mojang.Minecraft.svg /app/share/icons/hicolor/scalable/apps/com.mojang.Minecraft.svg
      - install -Dp -m 644 com.mojang.Minecraft.appdata.xml /app/share/appdata/com.mojang.Minecraft.appdata.xml
